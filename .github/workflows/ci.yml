name: Build and test

# The app cannot be built anywhere but macOS — SwiftUI, SwiftData and UIKit are
# Apple-platform only. Simulator builds need no signing certificate and no
# Apple Developer account, so this verifies the code compiles and the tests
# pass; it does not produce anything installable on a device.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The calculation engine imports nothing but Foundation, on purpose: it is the
  # part worth testing exhaustively, and Apple frameworks in it would make that
  # slow and awkward. Until now that rule was upheld by review. This job upholds
  # it mechanically — there is no UIKit, no SwiftUI and no SwiftData on Linux,
  # so a single stray import stops it compiling. It also runs the engine's tests
  # in about a minute, which is the fast half of the feedback loop.
  engine:
    name: Engine (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15

    # A container job runs its steps under `sh`, not bash, and dash has no
    # `set -o pipefail` — which failed the job in under a second, before the
    # compiler was ever reached.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$RUNNER_TEMP/engine.log"

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee -a "$RUNNER_TEMP/engine.log"


      # SwiftPM repeats the same diagnostic once per file in the module, so a
      # single error can fill a screen and a second one hides below it.
      - name: Summarise failures
        if: failure()
        run: |
          DIAGS=$(grep -hE "error:|warning:" "$RUNNER_TEMP/engine.log" 2>/dev/null \
            | grep -v '`- ' \
            | sort -u \
            | head -40)
          echo "----- engine diagnostics -----"
          echo "${DIAGS:-（none）}"
          echo "------------------------------"
          {
            echo "### Engine diagnostics (Linux)"
            echo ''
            echo '```'
            echo "${DIAGS:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: App and tests (iOS simulator)
    # Write access is for one thing only: force-pushing the screenshots branch.
    permissions:
      contents: write
    # `macos-latest` rather than a pinned version: a pinned label that the
    # account cannot schedule fails the job before any step runs, with no logs
    # to explain why.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The project uses Xcode 16 synchronized folder groups (objectVersion 77),
      # so an older Xcode cannot open it at all. Fail clearly rather than with a
      # confusing parse error.
      - name: Require Xcode 16 or newer
        run: |
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          echo "Xcode major version: $MAJOR"
          if [ "$MAJOR" -lt 16 ]; then
            echo "::error::This project needs Xcode 16 or newer (synchronized folder groups)."
            exit 1
          fi

      # Runner images change their simulator line-up, so pick whatever iPhone is
      # installed rather than hard-coding a model that may not be there.
      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available | sed -n '/-- iOS/,/^--/p'
          UDID=$(xcrun simctl list devices available \
            | grep "iPhone" \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on this runner."
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Building first gives a clean compile-error list without the test
      # bundle's output interleaved, which matters on a first green-field build.
      # Guards a step whose failure mode is not a red build but a green one
      # that quietly exports nothing. Here rather than on the cheaper Linux
      # job because the swift:6.0 container has no python3 — which is how the
      # first attempt at running these failed.
      - name: Screenshot renamer
        run: python3 Scripts/test_name_screenshots.py

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      - name: Test
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/Hours.xcresult"
          xcodebuild test \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Hours.xcresult" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test.log"

      # The screenshots for the App Store listing, taken by ScreenshotTests and
      # pulled out of the result bundle. xcresulttool names every exported file
      # after its UUID, so Scripts/name-screenshots.py puts the names the test
      # gave them back on.
      - name: App Store screenshots
        if: always()
        continue-on-error: true
        run: |
          RAW="$RUNNER_TEMP/attachments"
          OUT="$RUNNER_TEMP/screenshots"
          rm -rf "$RAW" "$OUT"
          mkdir -p "$RAW" "$OUT"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/Hours.xcresult" \
            --output-path "$RAW" || echo "::warning::could not export attachments"

          echo "----- manifest.json -----"
          head -c 4000 "$RAW/manifest.json" 2>/dev/null || echo "(no manifest)"
          echo ""
          echo "-------------------------"

          python3 Scripts/name-screenshots.py "$RAW" "$OUT"

          COUNT=$(find "$OUT" -type f -name '*.png' | wc -l | tr -d ' ')
          echo "PNG attachments exported: $COUNT"
          if [ "$COUNT" -ne 5 ]; then
            echo "::warning::expected 5 named screenshots, got $COUNT"
          fi

      # The run's artifacts live on a storage host that not every checkout can
      # reach, so the pictures also go to a branch of their own. An orphan
      # branch: they are build output, and build output in the history of the
      # source is a mistake that compounds.
      - name: Publish the screenshots to a branch
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/screenshots"
          if [ -z "$(ls -A "$OUT" 2>/dev/null)" ]; then
            echo "nothing to publish"
            exit 0
          fi
          WORK="$RUNNER_TEMP/shotbranch"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp "$OUT"/*.png "$WORK"/
          cd "$WORK"
          {
            echo "# Screenshots"
            echo ""
            echo "Taken by ScreenshotTests on an iOS simulator in CI, from commit"
            echo "${GITHUB_SHA}. Build output: this branch is replaced on every"
            echo "run and shares no history with main."
          } > README.md
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            screenshots
          echo "pushed to the screenshots branch"

      - name: Keep the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 30

      # A green tick does not say how many tests ran, and "0 tests passed" looks
      # identical to "126 tests passed". Put the count where it can be read.
      - name: Test summary
        if: always()
        run: |
          RESULTS=$(grep -hE "Test Suite '.*' (passed|failed)|Executed [0-9]+ test" \
            "$RUNNER_TEMP"/test.log 2>/dev/null \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | tail -30)
          # Printed as well as written to the summary: the step-summary file is
          # not reachable through the API, so stdout is the only copy a tool can
          # read back.
          echo "$RESULTS"
          {
            echo "### Tests"
            echo ''
            echo '```'
            echo "$RESULTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Compiler diagnostics are what someone reading a failed run wants, and
      # they are easy to lose in xcodebuild's noise.
      - name: Summarise failures
        if: failure()
        run: |
          # Failing tests first and on their own. CoreData logs several hundred
          # lines containing the word "error:" while the simulator sets up, and
          # a single sorted list let that noise crowd the real failures out of
          # the head of the output.
          FAILS=$(grep -hE 'error: -\[' "$RUNNER_TEMP"/*.log 2>/dev/null \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | sort -u \
            | head -40)
          DIAGS=$(cat "$RUNNER_TEMP"/*.log 2>/dev/null \
            | grep -E "(error|warning):" \
            | grep -v 'CoreData: error:' \
            | grep -vE 'error: -\[' \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | sort -u \
            | head -40)
          # Printed as well as written to the summary. The summary file cannot
          # be read back through the API, and on a failed run these are the only
          # output anyone actually wants.
          echo "----- failing tests -----"
          echo "${FAILS:-（none）}"
          echo "----- compiler diagnostics -----"
          echo "${DIAGS:-（none）}"
          echo "--------------------------------"
          {
            echo "### Failing tests"
            echo ''
            echo '```'
            echo "${FAILS:-none}"
            echo '```'
            echo "### Compiler diagnostics"
            echo ''
            echo '```'
            echo "${DIAGS:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
