name: Build and test

# The app cannot be built anywhere but macOS — SwiftUI, SwiftData and UIKit are
# Apple-platform only. Simulator builds need no signing certificate and no
# Apple Developer account, so this verifies the code compiles and the tests
# pass; it does not produce anything installable on a device.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # Off by default, and an input rather than something that just happens on
      # every run, for the reason spelled out on the build-and-test job: macOS
      # minutes bill at ten times the Linux rate and this account has run out of
      # them before. A walkthrough is around two minutes of simulator time —
      # twenty billable — which is cheap to ask for and expensive to take
      # without being asked.
      record_walkthrough:
        description: "Record a video of the app being used"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site is deployed by committing its build output into docs/, which buys
  # a privacy-policy URL that cannot break and costs exactly one failure mode:
  # somebody edits web/src, forgets `npm run publish`, and the live site quietly
  # keeps serving the previous build. This job is the price of that trade.
  # Linux, seconds, every push.
  site:
    name: Site (docs/ is current)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: docs/ matches web/
        working-directory: web
        run: npm run verify

  # 2,682 translations across nine languages, and the way they break is quiet:
  # a %@ dropped from a German sentence hands the format call the wrong
  # argument, and nothing complains until somebody sees a wrong number. This
  # checks every placeholder survives every translation, and that running the
  # generator is a no-op — the generator rewrites the catalogues from scratch,
  # so a translation living only in the .xcstrings would be erased by the next
  # person who ran it.
  translations:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Placeholders survive, nothing missing
        run: python3 Scripts/check-localizations.py

      # A literal handed to a view that takes String is shown verbatim. The app
      # shipped "Expected" and "Fields" in English on a German phone, between
      # rows that were translated, and nothing failed — it was found in a
      # screenshot.
      - name: No labels that only look localized
        run: python3 Scripts/check-localizable-labels.py

      - name: The catalogues are what the generator writes
        run: |
          python3 Scripts/build-catalog.py
          if ! git diff --quiet -- '*.xcstrings'; then
            echo "::error::The string catalogues are not what Scripts/build-catalog.py writes."
            echo "Translations belong in Scripts/translations.json. Run the generator and commit."
            git diff --stat -- '*.xcstrings'
            exit 1
          fi

  # The calculation engine imports nothing but Foundation, on purpose: it is the
  # part worth testing exhaustively, and Apple frameworks in it would make that
  # slow and awkward. Until now that rule was upheld by review. This job upholds
  # it mechanically — there is no UIKit, no SwiftUI and no SwiftData on Linux,
  # so a single stray import stops it compiling. It also runs the engine's tests
  # in about a minute, which is the fast half of the feedback loop.
  # Every push. It is cheap, it is fast, and it now covers most of the suite:
  # the calculation engine, the exports, the shifts, the adjustments and the
  # aggregation. See Package.swift for what it cannot reach.
  engine:
    name: Engine (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15

    # A container job runs its steps under `sh`, not bash, and dash has no
    # `set -o pipefail` — which failed the job in under a second, before the
    # compiler was ever reached.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$RUNNER_TEMP/engine.log"

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee -a "$RUNNER_TEMP/engine.log"


      # Printed on success as well as failure: the point of measuring is the
      # trend, and a number nobody sees while things are fine tells nobody
      # anything when they stop being fine.
      - name: Scale
        if: always()
        run: |
          sed -n '/----- scale -----/,/----- end scale -----/p' \
            "$RUNNER_TEMP/engine.log" 2>/dev/null || echo "(none)"

      # SwiftPM repeats the same diagnostic once per file in the module, so a
      # single error can fill a screen and a second one hides below it.
      - name: Summarise failures
        if: failure()
        run: |
          DIAGS=$(grep -hE "error:|warning:" "$RUNNER_TEMP/engine.log" 2>/dev/null \
            | grep -v '`- ' \
            | sort -u \
            | head -40)
          echo "----- engine diagnostics -----"
          echo "${DIAGS:-（none）}"
          echo "------------------------------"
          {
            echo "### Engine diagnostics (Linux)"
            echo ''
            echo '```'
            echo "${DIAGS:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # What a push actually touched.
  #
  # Cheap, on Linux, and the reason the job below it can exist at all: a push
  # that only moved the engine or the documentation skips macOS entirely.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      needsXcode: ${{ steps.check.outputs.needsXcode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          BEFORE="${{ github.event.before }}"
          # A new branch, a force-push or a first commit gives no usable base.
          # Assume the worst: a missed compile is the failure this exists to
          # prevent, and an extra run only costs money.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no usable base commit — compiling to be sure"
            echo "needsXcode=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "----- changed -----"
          echo "$CHANGED"
          echo "-------------------"

          # HoursCore is compiled and tested in full by the job above, and the
          # rest of this pattern is not code. Everything else — the app target,
          # the widget, the shared layer, the Apple-only tests, the project file
          # — has no compiler anywhere else in this workflow.
          UNCOVERED=$(echo "$CHANGED" | grep -vE '^(HoursCore/|Scripts/|[^/]*\.md$|\.gitignore$)' || true)
          if [ -n "$UNCOVERED" ]; then
            echo "needs Xcode, because of:"
            echo "$UNCOVERED"
            echo "needsXcode=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine, scripts and prose only — Linux already covered all of it"
            echo "needsXcode=false" >> "$GITHUB_OUTPUT"
          fi

  # Does the app still compile?
  #
  # Splitting the cheap half of the macOS job out from the expensive half, for
  # a reason found the hard way: after the full job was moved off pushes to
  # stop it exhausting the account's macOS allowance, nothing compiled the app
  # target on a push at all. Changes to app-only code — a screen, the
  # notification text — reached main having never been through a compiler,
  # green the whole way, because the Linux job builds HoursCore and nothing
  # else. A workflow that reports success on code it never built is worse than
  # one that reports nothing.
  #
  # So: build only, no tests, no simulator boot, on a generic destination.
  # Around a quarter of the full job, and it runs only when the push touched
  # something Linux cannot reach. `build-for-testing` rather than `build`
  # because the test bundles are code too, and a test file that does not
  # compile fails the same way.
  compile:
    name: App compiles (iOS simulator)
    needs: scope
    if: needs.scope.outputs.needsXcode == 'true'
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build the app and the test bundles
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/compile.log"

      # Same reason as the engine job: xcodebuild's failure output is long and
      # the one line that matters is rarely the last.
      - name: Summarise failures
        if: failure()
        run: |
          DIAGS=$(grep -hE "error:" "$RUNNER_TEMP/compile.log" 2>/dev/null | sort -u | head -40)
          echo "----- compile errors -----"
          echo "${DIAGS:-（none found — read the full log）}"
          echo "--------------------------"
          {
            echo "### Compile errors"
            echo ''
            echo '```'
            echo "${DIAGS:-none found — read the full log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: App and tests (iOS simulator)
    # Not on every push, on purpose.
    #
    # macOS minutes bill at ten times the Linux rate, and this job is around
    # ten minutes: roughly a hundred billable minutes a run. A day of ordinary
    # engine work ran it thirty times and exhausted the account's allowance,
    # after which nothing ran at all — one startup failure, then runs that sat
    # queued for hours without ever being picked up. A CI that cannot start is
    # worth less than one that covers less.
    #
    # So it runs where it earns its cost: on pull requests, and on demand. Most
    # of what it uniquely covers — SwiftData, StoreKit, SwiftUI, the
    # screenshots — changes far less often than the engine does.
    if: github.event_name != 'push'
    # Write access is for one thing only: force-pushing the screenshots branch.
    permissions:
      contents: write
    # `macos-latest` rather than a pinned version: a pinned label that the
    # account cannot schedule fails the job before any step runs, with no logs
    # to explain why.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The project uses Xcode 16 synchronized folder groups (objectVersion 77),
      # so an older Xcode cannot open it at all. Fail clearly rather than with a
      # confusing parse error.
      - name: Require Xcode 16 or newer
        run: |
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          echo "Xcode major version: $MAJOR"
          if [ "$MAJOR" -lt 16 ]; then
            echo "::error::This project needs Xcode 16 or newer (synchronized folder groups)."
            exit 1
          fi

      # Runner images change their simulator line-up, so pick whatever iPhone is
      # installed rather than hard-coding a model that may not be there.
      # Two devices, because the App Store wants two iPhone sizes and taking
      # the second set by hand is the sort of chore that gets skipped.
      #
      # The first is whatever large iPhone the runner has — a Pro Max or Plus
      # if one is installed, otherwise the first iPhone in the list — and it
      # runs the whole suite. The second is any *other* iPhone, and it runs
      # only ScreenshotTests, which costs about a minute.
      #
      # Neither model is named. Runner images retire simulators without notice,
      # and a hard-coded model that is no longer installed fails the job before
      # a line of the app has run.
      - name: Pick simulators
        id: sim
        run: |
          xcrun simctl list devices available | sed -n '/-- iOS/,/^--/p'

          udid_of() { sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/'; }
          name_of() { sed -E 's/^ *(.+) \([0-9A-Fa-f-]{36}\).*/\1/'; }

          IPHONES=$(xcrun simctl list devices available | grep "iPhone" || true)
          if [ -z "$IPHONES" ]; then
            echo "::error::No iPhone simulator available on this runner."
            exit 1
          fi

          # In preference order: a Pro Max is the 6.9-inch device Apple asks
          # for, a Plus is the same size, and anything else is a fallback so
          # the job still runs on a runner with a thin line-up. Matching
          # "Pro Max|Plus" in one pass took whichever came first in the list,
          # which was the Plus.
          BIG=$(echo "$IPHONES" | grep "Pro Max" | head -1)
          [ -n "$BIG" ] || BIG=$(echo "$IPHONES" | grep "Plus" | head -1)
          [ -n "$BIG" ] || BIG=$(echo "$IPHONES" | head -1)
          PRIMARY=$(echo "$BIG" | udid_of)
          PRIMARY_NAME=$(echo "$BIG" | name_of)

          # Any iPhone that is not the one already chosen.
          SMALL=$(echo "$IPHONES" | grep -v "$PRIMARY" | grep -vE "Pro Max|Plus" | head -1)
          [ -n "$SMALL" ] || SMALL=$(echo "$IPHONES" | grep -v "$PRIMARY" | head -1)
          SECONDARY=$(echo "$SMALL" | udid_of)
          SECONDARY_NAME=$(echo "$SMALL" | name_of)

          echo "primary   -> $PRIMARY_NAME ($PRIMARY)"
          if [ -n "$SECONDARY" ]; then
            echo "secondary -> $SECONDARY_NAME ($SECONDARY)"
          else
            echo "::warning::only one iPhone simulator on this runner; \
              the second screenshot size will have to be taken by hand"
          fi

          {
            echo "udid=$PRIMARY"
            echo "name=$PRIMARY_NAME"
            echo "second_udid=$SECONDARY"
            echo "second_name=$SECONDARY_NAME"
          } >> "$GITHUB_OUTPUT"

      # Guards a step whose failure mode is not a red build but a green one that
      # quietly exports nothing. Here rather than on the cheaper Linux job
      # because the swift:6.0 container has no python3 — which is how the first
      # attempt at running these failed.
      - name: Screenshot renamer
        run: python3 Scripts/test_name_screenshots.py

      # Building first gives a clean compile-error list without the test
      # bundle's output interleaved, which matters on a first green-field build.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      - name: Test
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/Hours.xcresult"
          xcodebuild test \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:HoursUITests/WalkthroughTests \
            -resultBundlePath "$RUNNER_TEMP/Hours.xcresult" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test.log"

      # The screenshots for the App Store listing, taken by ScreenshotTests and
      # pulled out of the result bundle. xcresulttool names every exported file
      # after its UUID, so Scripts/name-screenshots.py puts the names the test
      # gave them back on.
      # The same screenshots at the second size. Only ScreenshotTests, so the
      # suite is not paid for twice — the rest of it has already run above and
      # does not depend on the screen.
      - name: Screenshots at the second size
        if: always() && steps.sim.outputs.second_udid != ''
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/HoursSecond.xcresult"
          xcodebuild test \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination "id=${{ steps.sim.outputs.second_udid }}" \
            -only-testing:HoursUITests/ScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/HoursSecond.xcresult" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test-second.log"

      # The same screens in German. The site publishes a page per language and
      # showing an English app on the German one undoes the point of it; the
      # App Store also takes screenshots per localisation.
      #
      # -testLanguage launches the app in that language, which is exactly what
      # the ten localisations are for. It only works because ScreenshotTests
      # finds everything by accessibility identifier — a suite that waits for
      # buttons["Calendar"] passes in English and hangs here.
      - name: Screenshots in German
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/HoursGerman.xcresult"
          xcodebuild test \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:HoursUITests/ScreenshotTests \
            -testLanguage de \
            -testRegion DE \
            -resultBundlePath "$RUNNER_TEMP/HoursGerman.xcresult" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test-german.log"

      # A video of the app being used, which is the one thing a folder of
      # stills cannot show: how it moves, how long a screen takes to open, what
      # the transitions actually look like.
      #
      # `simctl io recordVideo` films the device, not the test, so the recorder
      # has to be running before xcodebuild starts and has to outlive it. Two
      # things make that work:
      #
      #   - The simulator is booted here rather than left to xcodebuild.
      #     recordVideo attaches to a booted device and exits immediately
      #     against one that is shut down; xcodebuild then boots it a second
      #     later and the recording is already over, having written a
      #     zero-length file and returned success.
      #   - The recorder is stopped with SIGINT. It finalises the MP4 container
      #     on that signal and only on that signal — killed any other way it
      #     leaves a file of the right size that no player will open.
      - name: Record a walkthrough
        if: github.event_name == 'workflow_dispatch' && inputs.record_walkthrough
        continue-on-error: true
        run: |
          set -o pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          VIDEO="$RUNNER_TEMP/walkthrough.mp4"
          rm -f "$VIDEO"

          # Built before the recorder starts rather than inside the test run.
          # `xcodebuild test` would build, install and launch on camera, and
          # a recording that opens with a minute of home screen is a recording
          # nobody watches to the end.
          xcodebuild build-for-testing \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination "id=$UDID" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/walkthrough-build.log" 2>&1 \
            || { echo "::warning::the walkthrough build failed"; tail -20 "$RUNNER_TEMP/walkthrough-build.log"; exit 0; }

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl io "$UDID" recordVideo --codec h264 --mask ignored "$VIDEO" &
          RECORDER=$!
          REC_START=$(python3 -c 'import time; print(time.time())')
          # Long enough for the recorder to have opened the file. Without it a
          # fast test can finish before the first frame is written.
          sleep 3

          set +e
          xcodebuild test-without-building \
            -project Hours.xcodeproj \
            -scheme Hours \
            -destination "id=$UDID" \
            -only-testing:HoursUITests/WalkthroughTests \
            -resultBundlePath "$RUNNER_TEMP/HoursWalkthrough.xcresult" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test-walkthrough.log"
          STATUS=$?
          set -e

          # A trailing second so the video does not end on the last tap, then
          # SIGINT and a wait for the file to be closed.
          sleep 1
          kill -INT $RECORDER 2>/dev/null || true
          wait $RECORDER 2>/dev/null || true

          if [ ! -s "$VIDEO" ]; then
            echo "::warning::no video was written"
            exit 0
          fi
          # Trim off everything before the app was on screen.
          #
          # recordVideo films the device, not the test, so the file opens with
          # xcodebuild installing the app and a long look at the home screen —
          # seventy of a hundred and thirty-eight seconds, the first time this
          # ran. How long that takes is a property of the runner on the day, so
          # the cut comes from a timestamp the app prints when its first screen
          # is up rather than from a fixed number.
          #
          # Both halves degrade rather than fail: no marker, or no ffmpeg on the
          # image, and the untrimmed file ships with a warning. A video with a
          # dull opening is worth more than no video.
          READY=$(grep -m1 -o 'WALKTHROUGH_READY [0-9.]*' "$RUNNER_TEMP/test-walkthrough.log" \
            | awk '{print $2}' || true)
          if [ -n "$READY" ] && command -v ffmpeg >/dev/null 2>&1; then
            # Half a second before the marker, so the first screen fades in on
            # camera rather than being there already.
            OFFSET=$(python3 -c "print(max(0, $READY - $REC_START - 0.5))")
            echo "trimming $OFFSET seconds of install and home screen"
            # Re-encoded, not stream-copied: a copy cuts to the nearest
            # keyframe rather than to the offset asked for, and leaves the file
            # at its capture size — 25 MB, onto a branch that is force-pushed
            # every run. Half resolution is still a retina phone screen.
            if ffmpeg -hide_banner -loglevel error -ss "$OFFSET" -i "$VIDEO" \
                 -vf "scale=660:-2" -c:v libx264 -preset veryfast -crf 24 \
                 -pix_fmt yuv420p -movflags +faststart -an \
                 "$RUNNER_TEMP/trimmed.mp4" -y \
               && [ -s "$RUNNER_TEMP/trimmed.mp4" ]; then
              mv "$RUNNER_TEMP/trimmed.mp4" "$VIDEO"
            else
              echo "::warning::the trim failed; keeping the full recording"
            fi
          elif [ -z "$READY" ]; then
            echo "::warning::no WALKTHROUGH_READY marker in the log — not trimmed"
          else
            echo "::warning::no ffmpeg on this runner — not trimmed"
          fi

          BYTES=$(wc -c < "$VIDEO" | tr -d ' ')
          echo "walkthrough.mp4: $BYTES bytes"
          # A recorder that attached to a device and filmed nothing still writes
          # a valid, tiny file. The floor is well under a real recording either
          # way: the untrimmed capture runs to tens of megabytes and the
          # trimmed, half-size one to about a megabyte.
          if [ "$BYTES" -lt 50000 ]; then
            echo "::warning::walkthrough.mp4 is only $BYTES bytes — probably a blank recording"
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::the walkthrough test failed; the video shows how far it got"
          fi

      # The screenshots for the App Store listing, taken by ScreenshotTests and
      # pulled out of the result bundles. xcresulttool names every exported file
      # after its UUID, so Scripts/name-screenshots.py puts the names the test
      # gave them back on.
      #
      # A folder per device, named after the simulator, because the two sets are
      # otherwise identical filenames and Apple wants them uploaded separately.
      - name: App Store screenshots
        if: always()
        continue-on-error: true
        env:
          PRIMARY_NAME: ${{ steps.sim.outputs.name }}
          SECOND_NAME: ${{ steps.sim.outputs.second_name }}
        run: |
          OUT="$RUNNER_TEMP/screenshots"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Turns "iPhone 16 Pro Max" into "iPhone-16-Pro-Max", so the folder is
          # a name rather than something that needs quoting forever after.
          slug() { echo "$1" | tr ' ' '-' | tr -cd '[:alnum:]-'; }

          harvest() {
            BUNDLE="$1"; FOLDER="$2"
            [ -d "$BUNDLE" ] || { echo "no result bundle at $BUNDLE"; return 0; }
            RAW="$RUNNER_TEMP/attachments-$(basename "$FOLDER")"
            rm -rf "$RAW"; mkdir -p "$RAW" "$OUT/$FOLDER"
            xcrun xcresulttool export attachments \
              --path "$BUNDLE" \
              --output-path "$RAW" || echo "::warning::could not export $BUNDLE"
            python3 Scripts/name-screenshots.py "$RAW" "$OUT/$FOLDER"
          }

          harvest "$RUNNER_TEMP/Hours.xcresult" "$(slug "$PRIMARY_NAME")"
          if [ -n "$SECOND_NAME" ]; then
            harvest "$RUNNER_TEMP/HoursSecond.xcresult" "$(slug "$SECOND_NAME")"
          fi
          # German goes in its own folder beside the device folders, so the two
          # sets never collide on identical filenames.
          harvest "$RUNNER_TEMP/HoursGerman.xcresult" "$(slug "$PRIMARY_NAME")-de"

          # The walkthrough video, if this run recorded one. Its own folder:
          # the device folders go to App Store Connect as they are and a stray
          # MP4 in one of them is a rejected upload.
          if [ -s "$RUNNER_TEMP/walkthrough.mp4" ]; then
            mkdir -p "$OUT/walkthrough"
            cp "$RUNNER_TEMP/walkthrough.mp4" "$OUT/walkthrough/"
            echo "walkthrough video included"
          fi

          # The German run is continue-on-error, which reports success even
          # when it fails — that is how an empty German folder went unnoticed
          # once already. Count the files rather than trust the step.
          GERMAN=$(find "$OUT" -path '*-de/*' -name '*.png' | wc -l | tr -d ' ')
          echo "german screenshots: $GERMAN"
          if [ "$GERMAN" -lt 6 ]; then
            echo "::warning::the German capture produced $GERMAN screenshots, expected at least 6 — see the \"Screenshots in German\" step"
          fi

          SHOTS=$(find "$OUT" -type f -name '*.png' | wc -l | tr -d ' ')
          FILES=$(find "$OUT" -type f ! -name '*.png' ! -name '*.mp4' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "screenshots: $SHOTS   export artifacts: $FILES"
          find "$OUT" -type f | sort
          # Six app screens plus up to four PDF pages; the CSV and the workbook
          # are the two non-images. A count below this means an attachment was
          # dropped, which has happened twice and looked green both times.
          if [ "$SHOTS" -lt 6 ]; then
            echo "::warning::expected at least 6 screenshots, got $SHOTS"
          fi
          if [ "$FILES" -lt 2 ]; then
            echo "::warning::expected the CSV and the workbook, got $FILES files"
          fi

      # The run's artifacts live on a storage host that not every checkout can
      # reach, so the pictures also go to a branch of their own. An orphan
      # branch: they are build output, and build output in the history of the
      # source is a mistake that compounds.
      - name: Publish the screenshots to a branch
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/screenshots"
          if [ -z "$(ls -A "$OUT" 2>/dev/null)" ]; then
            echo "nothing to publish"
            exit 0
          fi
          WORK="$RUNNER_TEMP/shotbranch"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp -R "$OUT"/. "$WORK"/
          cd "$WORK"
          {
            echo "# Screenshots"
            echo ""
            echo "Taken by ScreenshotTests on an iOS simulator in CI, from commit"
            echo "${GITHUB_SHA}. Build output: this branch is replaced on every"
            echo "run and shares no history with main."
          } > README.md
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            screenshots
          echo "pushed to the screenshots branch"

      - name: Keep the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 30

      # Diagnostics a test printed on purpose. The full test log is only kept as
      # an artifact, and an artifact is served from a host some checkouts cannot
      # reach — so anything meant to be read back has to come through stdout.
      # A green tick does not say how many tests ran, and "0 tests passed" looks
      # identical to "126 tests passed". Put the count where it can be read.
      - name: Test summary
        if: always()
        run: |
          RESULTS=$(grep -hE "Test Suite '.*' (passed|failed)|Executed [0-9]+ test" \
            "$RUNNER_TEMP"/test.log 2>/dev/null \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | tail -30)
          # Printed as well as written to the summary: the step-summary file is
          # not reachable through the API, so stdout is the only copy a tool can
          # read back.
          echo "$RESULTS"
          {
            echo "### Tests"
            echo ''
            echo '```'
            echo "$RESULTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Compiler diagnostics are what someone reading a failed run wants, and
      # they are easy to lose in xcodebuild's noise.
      - name: Summarise failures
        if: failure()
        run: |
          # Failing tests first and on their own. CoreData logs several hundred
          # lines containing the word "error:" while the simulator sets up, and
          # a single sorted list let that noise crowd the real failures out of
          # the head of the output.
          FAILS=$(grep -hE 'error: -\[' "$RUNNER_TEMP"/*.log 2>/dev/null \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | sort -u \
            | head -40)
          DIAGS=$(cat "$RUNNER_TEMP"/*.log 2>/dev/null \
            | grep -E "(error|warning):" \
            | grep -v 'CoreData: error:' \
            | grep -vE 'error: -\[' \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | sort -u \
            | head -40)
          # Printed as well as written to the summary. The summary file cannot
          # be read back through the API, and on a failed run these are the only
          # output anyone actually wants.
          echo "----- failing tests -----"
          echo "${FAILS:-（none）}"
          echo "----- compiler diagnostics -----"
          echo "${DIAGS:-（none）}"
          echo "--------------------------------"
          {
            echo "### Failing tests"
            echo ''
            echo '```'
            echo "${FAILS:-none}"
            echo '```'
            echo "### Compiler diagnostics"
            echo ''
            echo '```'
            echo "${DIAGS:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

      # Diagnostics a test printed on purpose, and deliberately the LAST step in
      # the job. The full test log is only kept as an artifact, artifacts are
      # served from a host some checkouts cannot reach, and the logs API caps
      # its response — so a block printed in the middle of a long job gets
      # truncated away. The end of the log is the one place that always
      # survives.
      - name: Test diagnostics
        if: always()
        run: |
          echo "=============== diagnostics ==============="
          # Failing tests are repeated here, and this is not redundant with the
          # step above. The logs API caps its response, so only the tail of a
          # job is reliably readable — three separate investigations were slowed
          # by reading a summary that had been truncated away. Whatever a person
          # needs after a red run goes last, where it survives.
          echo "--- failing tests ---"
          grep -hE 'error: -\[' "$RUNNER_TEMP"/*.log 2>/dev/null \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | sed -E 's|^/Users/runner/work/Hours/Hours/||' \
            | sort -u \
            | head -25 \
            || echo "(none)"
          # Compiler errors, which are what a red build usually is and were the
          # one thing this block did not print. Three investigations in a row
          # ended in guesswork because the real error was in the middle of the
          # log, where the API truncates it away. The tests excluded from the
          # Linux job — the ones touching SwiftUI and SwiftData — can only fail
          # here, so here is where their errors have to be readable.
          echo "--- compiler errors ---"
          grep -hE "error: " "$RUNNER_TEMP"/*.log 2>/dev/null \
            | grep -v 'CoreData: error:' \
            | grep -vE 'error: -\[' \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | sed -E 's|^/Users/runner/work/Hours/Hours/||' \
            | sort -u \
            | head -20
          echo "--- inflection ---"
          sed -n '/----- inflection -----/,/----- end inflection -----/p' \
            "$RUNNER_TEMP"/test.log 2>/dev/null \
            | sed -E 's/^[0-9-]+ [0-9:.]+ //' \
            | head -40
          echo "==========================================="
