name: App Store

# Uploads the store listing and screenshots, and creates the Pro products, in
# App Store Connect. Started by hand from the Actions tab; submits nothing for
# review and uploads no build — that is the TestFlight workflow's job.
#
#   listing   fastlane/metadata (both languages, the age rating, the
#             categories, the review notes) and the screenshots — iPhone
#             and Apple Watch — from the latest run of "Build and test" on
#             main, taken from the screenshots branch, provided they were
#             made for the version the project is at.
#   products  the subscription group, the monthly and yearly subscriptions
#             and the lifetime purchase, with their prices. Skips whatever
#             already exists, so it is safe to run again.
#
# Secrets reach fastlane only as environment variables and are never printed
# or written to a file: the same App Store Connect API key the TestFlight
# workflow uses (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT).

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to upload"
        type: choice
        options:
          - listing
          - products
          - both
        default: listing

permissions:
  contents: read

concurrency:
  # Two uploads to the same App Store Connect record at once would overwrite
  # each other's screenshots half way through.
  group: app-store
  cancel-in-progress: false

jobs:
  app-store:
    name: Upload to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      # fastlane warns, and some of its tools misbehave, without a UTF-8 locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_OPT_OUT_USAGE: "1"

    steps:
      - uses: actions/checkout@v4

      # The same check the TestFlight workflow starts with: the key works,
      # the Bundle ID is registered, the app exists. Each failure says how to
      # fix it, which beats deliver's version of the same news.
      - name: Preflight — check the Apple account
        run: fastlane ios preflight

      - name: Toolchain
        run: fastlane --version

      # Cheap, and the same check CI runs: a field over its limit is refused
      # by App Store Connect half way through the upload otherwise.
      - name: The listing fits
        if: inputs.what != 'products'
        run: python3 Scripts/check-store-metadata.py

      # "Build and test" lays the listing's shots out for deliver under
      # app-store/<locale>/ on the screenshots branch, already checked for a
      # size App Store Connect accepts. A missing set stops the upload here
      # rather than replacing good screenshots with none.
      #
      # The set says which version it was made for: the "# listing for
      # version" line of the listing.txt beside it, a copy of
      # fastlane/screenshots.txt as it was. A set made for another version
      # than the project's MARKETING_VERSION is refused, so 1.1's pictures
      # can never land on 1.0's page, nor 1.0's on 1.1's. A set published
      # before sets carried a version is 1.0's: seven iPhone shots, no watch.
      - name: Fetch the screenshots
        if: inputs.what != 'products'
        run: |
          set -o pipefail
          git fetch --depth 1 origin screenshots || {
            echo "::error::There is no screenshots branch yet. Run Actions › Build and test › Run workflow on main first."
            exit 1
          }
          DIR="$RUNNER_TEMP/store-screenshots"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          git archive FETCH_HEAD app-store | tar -x -C "$DIR" || {
            echo "::error::The screenshots branch has no app-store/ folder. It comes from a run of Build and test made after this workflow was added."
            exit 1
          }
          git log -1 --format='screenshots from %s (%cr)' FETCH_HEAD

          VERSIONS=$(sed -nE 's/.*MARKETING_VERSION = ([^;]+);.*/\1/p' Hours.xcodeproj/project.pbxproj | sort -u)
          if [ "$(echo "$VERSIONS" | wc -l | tr -d ' ')" != "1" ] || [ -z "$VERSIONS" ]; then
            echo "::error::The targets disagree on MARKETING_VERSION: $(echo $VERSIONS)"
            exit 1
          fi
          APP_VERSION="$VERSIONS"

          if git cat-file -e FETCH_HEAD:listing.txt 2>/dev/null; then
            git show FETCH_HEAD:listing.txt > "$RUNNER_TEMP/listing.txt"
            SHOTS_FOR=$(sed -nE 's/^#[[:space:]]*listing for version ([0-9][0-9.]*).*/\1/p' "$RUNNER_TEMP/listing.txt" | head -1)
            WANTED=$(grep -cvE '^(#|$)' "$RUNNER_TEMP/listing.txt" || true)
            WATCH_WANTED=$(git show FETCH_HEAD:watch-listing.txt 2>/dev/null | grep -cvE '^[[:space:]]*(#|$)' || true)
            # Made from the lists main has now, or main has moved on since.
            if ! cmp -s "$RUNNER_TEMP/listing.txt" fastlane/screenshots.txt; then
              echo "::error::The screenshots were taken from a different fastlane/screenshots.txt than this commit's. Run Actions › Build and test › Run workflow on main again."
              exit 1
            fi
            if [ "$WATCH_WANTED" -gt 0 ] && ! git show FETCH_HEAD:watch-listing.txt | cmp -s - fastlane/watch-screenshots.txt; then
              echo "::error::The watch screenshots were taken from a different fastlane/watch-screenshots.txt than this commit's. Run Actions › Build and test › Run workflow on main again."
              exit 1
            fi
          else
            SHOTS_FOR="1.0"
            WANTED=7
            WATCH_WANTED=0
          fi
          echo "screenshots made for $SHOTS_FOR; the project is $APP_VERSION"
          if [ "$SHOTS_FOR" != "$APP_VERSION" ]; then
            echo "::error::The screenshots on the branch are for version ${SHOTS_FOR:-(none)}, the project is $APP_VERSION. Nothing was uploaded. To switch to 1.1, see notes/listing-1.1/README.md; then run Build and test on main to take that version's set."
            exit 1
          fi

          # English shots only for now: App Store Connect shows the primary
          # language's screenshots on the German page too. Add de-DE back
          # here to upload German ones.
          SHOT_LOCALES="en-US"
          for LOCALE in $(ls "$DIR/app-store"); do
            case " $SHOT_LOCALES " in *" $LOCALE "*) ;; *) rm -rf "$DIR/app-store/$LOCALE" ;; esac
          done
          for LOCALE in $SHOT_LOCALES; do
            PHONE=$(find "$DIR/app-store/$LOCALE" -name 'iphone-*.png' | wc -l | tr -d ' ')
            WATCH=$(find "$DIR/app-store/$LOCALE" -name 'watch-*.png' | wc -l | tr -d ' ')
            echo "$LOCALE: $PHONE iPhone (of $WANTED), $WATCH Apple Watch (of $WATCH_WANTED)"
            if [ "$PHONE" -lt "$WANTED" ]; then
              echo "::error::$LOCALE has $PHONE of $WANTED iPhone screenshots. Run Build and test on main again and check its screenshot steps."
              exit 1
            fi
            # The watch set is English only (Scripts/store-screenshots.py).
            if [ "$LOCALE" = "en-US" ] && [ "$WATCH" -lt "$WATCH_WANTED" ]; then
              echo "::error::$LOCALE has $WATCH of $WATCH_WANTED Apple Watch screenshots. Run Build and test on main again and check its \"Apple Watch screenshots\" step."
              exit 1
            fi
          done
          echo "SCREENSHOTS_DIR=$DIR/app-store" >> "$GITHUB_ENV"

      - name: Upload the listing
        if: inputs.what != 'products'
        run: fastlane ios listing

      - name: Create the Pro products
        if: inputs.what != 'listing'
        run: fastlane ios products
