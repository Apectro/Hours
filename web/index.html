<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hours — a work-hours calendar that stays on your phone</title>
    <meta
      name="description"
      content="Record your hours on a calendar, see your balance, and hand payroll a timesheet in ten languages. No account, no server, nothing collected."
    />
    <meta name="theme-color" content="#1b5b8e" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta property="og:title" content="Hours" />
    <meta
      property="og:description"
      content="A work-hours calendar that keeps your hours on your phone. No account, no server, nothing collected."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zeitkonto.app/" />
    <!-- Unfurlers do not resolve relative URLs, so this one is absolute and
         has to change with the site's address. -->
    <meta property="og:image" content="https://zeitkonto.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Hours — your hours, on your phone, and nowhere else. Beside the balance line: worked + credited − expected + adjustment = balance."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Courier+Prime:wght@400;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
        Stamp the saved choice before anything paints. React cannot do this:
        it runs after the first paint, so the page would show the system theme
        for a frame and then swap, which is the flash every themed site has.

        localStorage throws outright in some privacy modes rather than
        returning null, hence the catch. No saved choice means no stamp, and
        the stylesheet falls through to prefers-color-scheme.
      */
      try {
        var saved = localStorage.getItem("hours-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
