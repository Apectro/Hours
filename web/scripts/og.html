<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Replaced by scripts/og.mjs with the real faces, base64-inlined. */
  /* FONTS */
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; display: flex; overflow: hidden;
    background: #F4F6FA; color: #12161C;
    font-family: "Archivo", system-ui, sans-serif;
  }
  .words {
    flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: 68px 0 68px 76px;
  }
  .shot {
    flex: 0 0 380px; display: flex; align-items: flex-start;
    padding: 74px 76px 0 40px;
  }
  .shot img {
    width: 264px; border-radius: 26px; border: 1px solid #D3DAE4;
    box-shadow: 0 26px 60px -28px rgba(18, 22, 28, 0.45);
    display: block;
  }
  .top { display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 52px; height: 52px; border-radius: 13px; background: #276099;
    color: #fff; font-size: 30px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .name { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 60px; line-height: 1.04; letter-spacing: -0.025em; max-width: 15ch; font-weight: 700; }
  .line {
    font-family: "JetBrains Mono", monospace;
    font-size: 23px; color: #3A4250; display: flex; gap: 0.5ch; flex-wrap: nowrap;
    padding-top: 26px; border-top: 1px solid #D3DAE4;
  }
  .op { color: #7C8697; }
  .term { color: #12161C; }
  .result { color: #276099; font-weight: 500; }
</style></head>
<body>
  <div class="words">
    <div class="top"><div class="mark">h</div><div class="name">Hours</div></div>
    <h1>Your hours, on your phone, and nowhere else.</h1>
    <p class="line">
      <span class="term">worked</span><span class="op">+</span><span class="term">credited</span><span class="op">−</span><span class="term">expected</span><span class="op">+</span><span class="term">adjustment</span><span class="op">=</span><span class="result">balance</span>
    </p>
  </div>
  <div class="shot"><img src="/* SHOT */" alt=""></div>
</body></html>
